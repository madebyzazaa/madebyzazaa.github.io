<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>purebasket</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <header>
        <div class="username-bx"><p id="username">Emmanuel E.</p></div>
       <p class="streak-txt" id="streak-txt">streak: 0days 🔥</p>
    </header>
    <main>
        <section class="sec1">
            <div class="backdrop"><img class="counter" src="images/tally-counter2.png" alt="finger tally counter white"></div>
        </section>
        <section class="sec2">
            <div class="card1">
                <p class="card1-header">streak    </p>
                <h2 class="streak-value" id="streak-value">0 days</h2>
            </div>
            <div class="card2">
                <p class="card2-header">record</p>
                <h2 class="record-value" id="record-value">0 / 0 days</h2>
            </div>
        </section>
            <section class="sec3">
            <div class="card3">
                <div class="card3-top">
                    <div><p class="tbtm">TOTAL BASKETS THIS MONTH:</p><h2 id="tbtm-value">000</h2></div>
                    <div><p class="da">DAILY AVG:</p><h2 id="da-value">00</h2></div>
                </div>
                <div class="grid">

                    </div>
            </div>
            <button class="add" id="add">create record +</button>
        </section>
        <section class="form" id="form">
            <div class="top"><h2 style="font-size: 20px; font-weight: lighter;">RECORD</h2><p>report</p></div>
            <input type="text" class="input" type="number">
            <div class="btns"><button class="save">save</button><button class="sync">sync</button></div>
        </section>
    </main>
</div>
</body>
<script src="index.js"></script>
</html>
